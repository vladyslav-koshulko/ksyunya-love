<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9eeea">
  <title>Ксюне, с любовью ♡</title>
  <style>
    :root { color-scheme: light; --wine: #792d44; --rose: #c75573; --paper: #fffaf5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; color: var(--wine); background: #f9eeea; font-family: Georgia, 'Times New Roman', serif; }
    body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 15% 20%, #edb8c544, transparent 55%), radial-gradient(ellipse at 90% 90%, #eec6a744, transparent 50%); }
    main { min-height: 100svh; display: grid; place-items: center; padding: 58px 22px; overflow: hidden; position: relative; isolation: isolate; }
    .note { width: min(100%, 650px); padding: 56px 40px 38px; text-align: center; position: relative; background: var(--paper); border: 1px solid #d99aaa55; box-shadow: 0 28px 80px #792d4410, 0 3px 12px #792d4407; animation: arrive 1.2s ease both; }
    .note::before { content: ''; position: absolute; inset: 10px; border: 1px solid #d99aaa44; pointer-events: none; }
    .eyebrow, .caption, .footer { font-family: system-ui, sans-serif; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; }
    .eyebrow { margin: 0 0 30px; color: #a1737e; }
    .flower { display: block; font-size: 35px; color: var(--rose); margin-bottom: 25px; }
    h1 { margin: 0; font-weight: 400; font-size: clamp(27px, 5.8vw, 41px); line-height: 1.45; letter-spacing: -.035em; }
    h1 .name { display: block; font-style: italic; font-size: clamp(64px, 14vw, 98px); line-height: 1.1; margin-bottom: 20px; }
    h1 .last { display: block; }
    .rule { width: 42px; height: 1px; background: #d6a4ae; margin: 30px auto 25px; }
    .heart-button { position: relative; display: inline-grid; place-items: center; width: 74px; height: 74px; padding: 0; border: 1px solid #e7bfca; border-radius: 50%; color: var(--rose); background: #fbeef1; cursor: pointer; transition: background .2s, transform .2s; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .heart-button:hover { background: #f6dee5; transform: translateY(-3px); }
    .heart-button:focus-visible { outline: 3px solid var(--wine); outline-offset: 5px; }
    .heart-button svg { width: 30px; height: 30px; animation: heartbeat 2.8s ease-in-out infinite; }
    .caption { margin: 17px 0 0; color: #a1737e; font-size: 9px; letter-spacing: .16em; }
    .footer { position: absolute; bottom: 22px; left: 0; width: 100%; text-align: center; color: #a1737e; font-size: 9px; }
    .floating { position: absolute; z-index: -1; color: #cf8c9c; font-size: var(--size); left: var(--left); bottom: -80px; opacity: 0; pointer-events: none; animation: drift var(--duration) var(--delay) linear infinite; }
    .burst { position: fixed; z-index: 3; pointer-events: none; color: var(--rose); font-size: 23px; animation: burst 1.5s ease-out forwards; }
    @keyframes arrive { from { opacity: 0; transform: translateY(20px) rotate(-1deg); } to { opacity: 1; transform: translateY(0) rotate(0); } }
    @keyframes heartbeat { 0%, 40%, 100% { transform: scale(1); } 48% { transform: scale(1.14); } 56% { transform: scale(1); } 64% { transform: scale(1.09); } }
    @keyframes drift { 0% { opacity: 0; transform: translate(0, 0) rotate(-15deg); } 15%, 75% { opacity: .35; } 100% { opacity: 0; transform: translate(40px, -115svh) rotate(22deg); } }
    @keyframes burst { from { opacity: 1; transform: translate(-50%, -50%) scale(.6); } to { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(var(--turn)) scale(1.2); } }
    @media (max-width: 480px) { .note { padding: 43px 24px 32px; } .eyebrow { margin-bottom: 22px; } .flower { margin-bottom: 20px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .floating, .burst { display: none; } }
  </style>
</head>
<body>
  <main>
    <span class="floating" aria-hidden="true" style="--left:8%;--size:34px;--duration:16s;--delay:-4s">♡</span>
    <span class="floating" aria-hidden="true" style="--left:87%;--size:54px;--duration:20s;--delay:-13s">♡</span>
    <span class="floating" aria-hidden="true" style="--left:20%;--size:22px;--duration:18s;--delay:-10s">♥</span>
    <span class="floating" aria-hidden="true" style="--left:75%;--size:25px;--duration:15s;--delay:-2s">♡</span>
    <span class="floating" aria-hidden="true" style="--left:49%;--size:28px;--duration:22s;--delay:-17s">♡</span>
    <article class="note" aria-label="Признание в любви">
      <p class="eyebrow">Маленькое письмо для тебя</p>
      <span class="flower" aria-hidden="true">❋</span>
      <h1><span class="name">Ксюня,</span> солнышко мое, я люблю тебя <span class="last">милая моя</span></h1>
      <div class="rule" aria-hidden="true"></div>
      <button class="heart-button" type="button" aria-label="Отправить сердечки">
        <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16 28S3 20 3 10.5C3 3.5 12 1 16 8c4-7 13-4.5 13 2.5C29 20 16 28 16 28Z"/></svg>
      </button>
      <p class="caption">Нажми на сердечко</p>
    </article>
    <div class="footer">С любовью, каждое мгновение ♡</div>
  </main>
  <script>
    const heart = document.querySelector('.heart-button');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    heart.addEventListener('click', () => {
      if (reducedMotion.matches) {
        document.querySelector('.caption').textContent = '♥ ♥ ♥';
        return;
      }
      const bounds = heart.getBoundingClientRect();
      for (let i = 0; i < 12; i++) {
        const particle = document.createElement('span');
        particle.className = 'burst';
        particle.textContent = i % 2 ? '♡' : '♥';
        particle.setAttribute('aria-hidden', 'true');
        particle.style.left = `${bounds.left + bounds.width / 2}px`;
        particle.style.top = `${bounds.top + bounds.height / 2}px`;
        particle.style.setProperty('--x', `${(Math.random() - .5) * 300}px`);
        particle.style.setProperty('--y', `${-90 - Math.random() * 180}px`);
        particle.style.setProperty('--turn', `${(Math.random() - .5) * 80}deg`);
        document.body.append(particle);
        particle.addEventListener('animationend', () => particle.remove(), { once: true });
      }
    });
  </script>
</body>
</html>
